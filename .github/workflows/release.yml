name: release

# Pushing a tag vX.Y.Z (matching DESCRIPTION's Version) runs the full check
# matrix, then builds and publishes:
#   - Rsafd_X.Y.Z.tar.gz  source package (any OS)
#   - Rsafd_X.Y.Z.zip     Windows binary (current R release)
#   - Rsafd_X.Y.Z.tgz     macOS binary (current R release)
#   - Rsafd.tar.gz / Rsafd.zip  stable aliases for .../releases/latest/download/
#   - SHA256SUMS
#   - ghcr.io/princetonuniversity/rsafd:{X.Y.Z, X.Y, latest, sha}
# Use scripts/release.sh to bump the version and create the tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag must be vX.Y.Z and match DESCRIPTION and NEWS.md
        id: v
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$tag' is not of the form vX.Y.Z"; exit 1
          fi
          version="${tag#v}"
          desc_version=$(sed -n 's/^Version:[[:space:]]*//p' DESCRIPTION)
          if [[ "$desc_version" != "$version" ]]; then
            echo "::error::Tag $tag does not match DESCRIPTION Version $desc_version"; exit 1
          fi
          if ! grep -q "^# Rsafd ${version}\$" NEWS.md; then
            echo "::error::NEWS.md has no '# Rsafd ${version}' section"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  checks:
    needs: verify
    uses: ./.github/workflows/R-CMD-check.yml

  source:
    needs: [verify, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
      - name: Build source package
        run: |
          set -euo pipefail
          mkdir -p dist
          R CMD build --no-manual .
          mv "Rsafd_${{ needs.verify.outputs.version }}.tar.gz" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: dist/
          if-no-files-found: error

  binary:
    needs: [verify, source]
    name: binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
      - name: XQuartz for tcltk (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask xquartz
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: dist
      - name: Build binary package
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          R CMD INSTALL --build "Rsafd_${{ needs.verify.outputs.version }}.tar.gz"
          rm "Rsafd_${{ needs.verify.outputs.version }}.tar.gz"
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: [verify, source, binary]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Download only the package artifacts by name; the run also contains
      # Docker build-record artifacts that download-artifact cannot extract.
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Assemble assets
        run: |
          set -euo pipefail
          v="${{ needs.verify.outputs.version }}"
          cd dist
          test -f "Rsafd_${v}.tar.gz" && test -f "Rsafd_${v}.zip" && test -f "Rsafd_${v}.tgz"
          cp "Rsafd_${v}.tar.gz" Rsafd.tar.gz
          cp "Rsafd_${v}.zip" Rsafd.zip
          sha256sum Rsafd_* Rsafd.tar.gz Rsafd.zip > SHA256SUMS
          cat SHA256SUMS
      - name: Release notes from NEWS.md
        run: |
          set -euo pipefail
          v="${{ needs.verify.outputs.version }}"
          awk -v h="# Rsafd ${v}" '$0==h{f=1;next} /^# Rsafd /{f=0} f' NEWS.md > notes.md
          test -s notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          v="${{ needs.verify.outputs.version }}"
          gh release create "v${v}" dist/* \
            --title "Rsafd ${v}" --notes-file notes.md --verify-tag

  image:
    needs: [verify, checks]
    name: image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    env:
      # Don't upload .dockerbuild build-record artifacts to the run.
      DOCKER_BUILD_RECORD_UPLOAD: false
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/rsafd" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/jupyter/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          tags: ${{ steps.name.outputs.image }}:${{ needs.verify.outputs.version }}-${{ matrix.arch }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            GH_OWNER=${{ github.repository_owner }}

  manifest:
    needs: [verify, image, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch tags
        run: |
          set -euo pipefail
          image="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/rsafd"
          v="${{ needs.verify.outputs.version }}"
          minor="${v%.*}"
          sha="${GITHUB_SHA::12}"
          docker buildx imagetools create \
            -t "$image:$v" -t "$image:$minor" -t "$image:latest" -t "$image:$sha" \
            "$image:$v-amd64" "$image:$v-arm64"
          docker buildx imagetools inspect "$image:$v"
          {
            echo "Published $image tags: $v, $minor, latest, $sha"
          } >> "$GITHUB_STEP_SUMMARY"
